packages:
  - .
  - example
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: ^1.7.0
  vitest: ^5.1.0
minimumReleaseAgeExclude:
  - '@nkzw/oxlint-config@3.0.0'
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
